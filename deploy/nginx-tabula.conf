# /etc/nginx/sites-available/tabula.wefaber.net  ->  symlink en sites-enabled
# https://tabula.wefaber.net:9443 (tailnet only)
#
# Topologia real del host (la misma de panel.wefaber.net):
#   - nginx escucha en la IP del tailnet :9443, NO en :443: tailscaled es dueño de 100.113.187.112:443.
#   - Bloque loopback 127.0.0.1:443: es el que usan los checks del deploy (deploy/tabula.sh).
#   - allow 100.64.0.0/10: inalcanzable desde internet publico por construccion.
#   - DNS Cloudflare DNS-only (nunca proxied): A tabula -> 100.113.187.112.
#   - Cert DNS-01 (HTTP-01 no puede, el nombre resuelve a una IP de tailnet):
#       sudo certbot certonly --dns-cloudflare \
#         --dns-cloudflare-credentials /home/hermes/apolo/config/cloudflare.ini \
#         -d tabula.wefaber.net
#
# Backend: el include de abajo lo reescribe deploy/tabula.sh al cambiar de slot (4171 blue / 4172 green).
# Deploy: .github/workflows/deploy.yml -> bash deploy/tabula.sh <sha>
# Rollback: workflow_dispatch action=rollback
include /home/hermes/deploy/nginx/tabula-upstream.conf;

server {
    listen 100.113.187.112:80;
    server_name tabula.wefaber.net;
    return 301 https://$host:9443$request_uri;
}

server {
    listen 100.113.187.112:9443 ssl;
    http2 on;
    server_name tabula.wefaber.net;

    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    allow 127.0.0.1;   # health checks from the VPS itself (deploy script)
    deny all;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/hsts.conf;

    ssl_certificate     /etc/letsencrypt/live/tabula.wefaber.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabula.wefaber.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://tabula_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # El panel identifica por IP del dispositivo (tailscaled whois): IP real, nunca la de un proxy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Solo Tailscale Serve puede setear este header; aca siempre se limpia.
        proxy_set_header Tailscale-User-Login "";
        # SSE: sin buffering, lecturas largas.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# Chequeo local del deploy (loopback): mismo upstream y mismo certificado.
server {
    listen 127.0.0.1:443 ssl;
    http2 on;
    server_name tabula.wefaber.net;

    ssl_certificate     /etc/letsencrypt/live/tabula.wefaber.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabula.wefaber.net/privkey.pem;

    location / {
        proxy_pass http://tabula_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Tailscale-User-Login "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
