# /etc/nginx/sites-available/tabula.wefaber.net  ->  https://tabula.wefaber.net:9443
# (gravidadev.wefaber.net keeps answering as an alias)
#
# Port 9443, never 443: tailscaled owns 100.113.187.112:443 on this host (Tailscale Serve/Funnel), so a server
# block on that socket never receives the request and the TLS handshake fails with internal_error. Same topology
# as the precedent vhosts panel.wefaber.net and board-dev.eternum.lat.
#
# Tailnet only: nginx binds the VPS tailnet address (never a public one) and refuses everything outside 100.64.0.0/10.
# The panel identifies people by their device's tailnet IP (tailscaled whois), so $remote_addr has to be the real
# client address: no proxy in front, and X-Real-IP is always overwritten here.
#
# Cert: certbot DNS-01 (dns-cloudflare, token at /home/hermes/apolo/config/cloudflare.ini), no public vhost needed:
#   sudo certbot certonly --dns-cloudflare --dns-cloudflare-credentials /home/hermes/apolo/config/cloudflare.ini \
#     -d tabula.wefaber.net -d gravidadev.wefaber.net
# DNS: A records tabula.wefaber.net and gravidadev.wefaber.net -> 100.113.187.112 (DNS only, grey cloud). They resolve to a tailnet address,
# so it only works for devices on the tailnet; Pablo and Jean need no hosts-file edit.
include /home/hermes/deploy/nginx/tabula-upstream.conf;

server {
    listen 100.113.187.112:80;
    server_name tabula.wefaber.net gravidadev.wefaber.net;
    return 301 https://$host:9443$request_uri;
}

server {
    listen 100.113.187.112:9443 ssl;
    http2 on;
    server_name tabula.wefaber.net gravidadev.wefaber.net;

    # One certificate for both names; certbot names the directory after the first -d.
    ssl_certificate     /etc/letsencrypt/live/tabula.wefaber.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabula.wefaber.net/privkey.pem;

    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    allow 127.0.0.1;   # health checks from the VPS itself (deploy script)
    deny all;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://tabula_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Only Tailscale Serve may set this one; here it is always cleared.
        proxy_set_header Tailscale-User-Login "";
        # SSE: no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
