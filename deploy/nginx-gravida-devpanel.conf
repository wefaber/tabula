# /etc/nginx/conf.d/gravida-devpanel.conf. Loopback only: Tailscale Serve (https :8445) is the only way in, and it
# injects Tailscale-User-Login. Never listen on a public address: that header would be spoofable.
include /home/hermes/deploy/nginx/gravida-devpanel-upstream.conf;

server {
    listen 127.0.0.1:4170;
    server_name _;

    location / {
        proxy_pass http://gravida-devpanel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Serve already set it; pass it through untouched.
        proxy_set_header Tailscale-User-Login $http_tailscale_user_login;
        # SSE: no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
