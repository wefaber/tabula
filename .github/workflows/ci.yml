name: CI

# Checks de cada PR y de cada push a main/dev. Corre en runners de GitHub: nunca en el self-hosted, porque el repo
# es publico y un PR de un fork no puede ejecutar codigo en el VPS. El deploy vive en deploy.yml.
on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.2

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Formato
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Tipos
        run: bun run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: dist/ no esta vacio
        run: test -s dist/index.html

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis y shellcheck
        run: |
          bash -n deploy/gravida-devpanel.sh
          shellcheck --severity=warning deploy/gravida-devpanel.sh
      - name: Los .sh del repo son LF
        run: |
          if git ls-files '*.sh' | xargs grep -l $'\r'; then
            echo "::error::hay scripts con CRLF; correrian mal en Linux"
            exit 1
          fi

  # Una sola compuerta para branch protection: exige que todos los de arriba hayan pasado.
  ci:
    name: CI ok
    if: always()
    needs: [static, test, build, deploy-scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Resultado
        run: |
          echo '${{ toJSON(needs) }}'
          if [ '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' = 'true' ]; then
            exit 1
          fi
